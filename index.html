<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2856d9"><title>TaskFlow</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172331;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:7vh auto;padding:32px;background:white;border:1px solid #e6eaf0;border-radius:22px;box-shadow:0 12px 40px #1b2b4510}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:2.3rem;letter-spacing:-.05em;margin:0}.eyebrow{font-size:.72rem;letter-spacing:.16em;font-weight:700;color:#596c8b}.muted,footer{color:#66778c}#count{font-size:.85rem;background:#edf4ff;padding:9px 12px;border-radius:99px;white-space:nowrap}form{display:flex;flex-wrap:wrap;gap:9px;margin:28px 0 20px}#new-task{flex:1 1 220px;min-width:0;padding:15px;border:1px solid #cfd7e3;border-radius:11px;font:inherit}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:#2856d9;color:white;font-weight:600}button:hover{filter:brightness(.94)}nav{display:flex;gap:7px;border-bottom:1px solid #e8ebf0;padding-bottom:16px}.filter{background:#f0f2f7;color:#526277}.filter.active{background:#2856d9;color:white}ul{list-style:none;padding:0;margin:12px 0}li{display:flex;align-items:center;gap:12px;border-bottom:1px solid #edf0f4;padding:13px 0}li span{overflow-wrap:anywhere}li input{width:19px;height:19px;accent-color:#2856d9}.done{text-decoration:line-through;color:#8692a1}.quiet{background:transparent;color:#526277;padding:7px}.danger{color:#b43a49}.empty{text-align:center;padding:35px}.priority-select,.sort-select{font:inherit;border:1px solid #cfd7e3;border-radius:9px;padding:10px;background:#fff;color:#263951}.priority-select{max-width:125px}.sortbar{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 0 2px;color:#66778c;font-size:.85rem}.priority-tag{font-size:.72rem;font-weight:700;border-radius:99px;padding:4px 8px;background:#eef1f5;color:#4e5c6c}.priority-tag.high{background:#ffebec;color:#a52837}.priority-tag.low{background:#e7f4ed;color:#286344}.task-body{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}.task-body .done{text-decoration:line-through;color:#8692a1}footer{font-size:.8rem;margin-top:24px}.sr{position:absolute;left:-9999px}@media(max-width:600px){.app{margin:0;min-height:100dvh;border:0;border-radius:0;padding:24px 18px}h1{font-size:2rem}form{gap:7px}form button{padding:10px}.priority-select{max-width:90px;padding:8px 3px}.task-body{gap:3px}li{gap:7px}.quiet{padding:6px;font-size:.86rem}}
</style></head><body><main class="app"><header><div><p class="eyebrow">YOUR DAY, SIMPLIFIED</p><h1>TaskFlow</h1><p class="muted">A little clarity for what comes next.</p></div><span id="count" aria-live="polite"></span></header>
<form id="add-form"><label for="new-task" class="sr">New task</label><input id="new-task" placeholder="What needs to get done?" maxlength="200" required autocomplete="off"><label for="new-priority" class="sr">Task priority</label><select id="new-priority" class="priority-select" aria-label="New task priority"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select><button type="submit">Add task</button></form>
<nav aria-label="Task filters"><button type="button" class="filter active" data-filter="all" aria-pressed="true">All</button><button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button><button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button></nav><div class="sortbar"><label for="sort-order">Sort:</label><select id="sort-order" class="sort-select"><option value="created">Date added</option><option value="priority">Priority (high first)</option></select></div>
<ul id="tasks" aria-live="polite"></ul><p id="empty" class="muted empty" hidden>No tasks here yet.</p><footer>Saved on this device · No account needed</footer></main>
<script>
"use strict";
const KEY="taskflow.tasks.v1",RANK={high:0,medium:1,low:2},list=document.querySelector("#tasks"),input=document.querySelector("#new-task"),count=document.querySelector("#count"),empty=document.querySelector("#empty");
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v.filter(t=>t&&typeof t.id==="string"&&typeof t.title==="string"&&t.title.trim()&&t.title.length<=200&&typeof t.done==="boolean").map(t=>({...t,priority:RANK[t.priority]===undefined?"medium":t.priority})):[]}catch{return []}}
let tasks=load(),filter="all",sort="created",notice="";
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));tasks=next;notice=""}catch{notice="Storage unavailable; changes were not saved."}render()}
function render(){list.replaceChildren();const visible=tasks.filter(t=>filter==="all"||t.done===(filter==="completed"));if(sort==="priority")visible.sort((a,b)=>RANK[a.priority]-RANK[b.priority);empty.hidden=visible.length!==0;count.textContent=tasks.filter(t=>!t.done).length+" remaining";
for(const task of visible){const li=document.createElement("li"),checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.checked=task.done;checkbox.setAttribute("aria-label","Complete "+task.title);checkbox.addEventListener("change",()=>persist(tasks.map(t=>t.id===task.id?{...t,done:!t.done}:t)));
const body=document.createElement("div");body.className="task-body";const title=document.createElement("span");title.textContent=task.title;if(task.done)title.className="done";const priority=document.createElement("span");priority.className="priority-tag "+task.priority;priority.textContent=task.priority[0].toUpperCase()+task.priority.slice(1)+" priority";body.append(title,priority);
const edit=document.createElement("button");edit.textContent="Edit";edit.className="quiet";edit.addEventListener("click",()=>{const answer=prompt("Edit task",task.title);if(answer===null)return;const value=answer.trim();if(!value||value.length>200){alert("Enter 1–200 characters.");return}persist(tasks.map(t=>t.id===task.id?{...t,title:value}:t))});
const del=document.createElement("button");del.textContent="Delete";del.className="quiet danger";del.setAttribute("aria-label","Delete "+task.title);del.addEventListener("click",()=>persist(tasks.filter(t=>t.id!==task.id)));
li.append(checkbox,body,edit,del);list.append(li)}
let warning=document.querySelector("#storage-warning");if(!warning){warning=document.createElement("p");warning.id="storage-warning";warning.setAttribute("role","alert");list.after(warning)}warning.textContent=notice}
document.querySelector("#add-form").addEventListener("submit",e=>{e.preventDefault();const value=input.value.trim();if(!value||value.length>200)return;const id=(typeof crypto!=="undefined"&&typeof crypto.randomUUID==="function")?crypto.randomUUID():"task-"+Date.now()+"-"+Math.random().toString(36).slice(2);const next=[...tasks,{id,title:value,done:false,priority:document.querySelector("#new-priority").value}];persist(next);if(!notice){input.value="";document.querySelector("#new-priority").value="medium"}});
document.querySelector("#sort-order").addEventListener("change",e=>{sort=e.target.value;render()});
document.querySelectorAll("[data-filter]").forEach(button=>button.addEventListener("click",()=>{filter=button.dataset.filter;document.querySelectorAll("[data-filter]").forEach(b=>{const selected=b===button;b.classList.toggle("active",selected);b.setAttribute("aria-pressed",String(selected))});render()}));render();
</script></body></html>
