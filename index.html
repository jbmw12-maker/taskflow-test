<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2856d9"><title>TaskFlow</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172331;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:720px;margin:7vh auto;padding:32px;background:white;border:1px solid #e6eaf0;border-radius:22px;box-shadow:0 12px 40px #1b2b4510}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:2.3rem;letter-spacing:-.05em;margin:0}.eyebrow{font-size:.72rem;letter-spacing:.16em;font-weight:700;color:#596c8b}.muted,footer{color:#66778c}#count{font-size:.85rem;background:#edf4ff;padding:9px 12px;border-radius:99px;white-space:nowrap}form{display:flex;gap:9px;margin:28px 0 20px}#new-task{flex:1;min-width:0;padding:15px;border:1px solid #cfd7e3;border-radius:11px;font:inherit}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:#2856d9;color:white;font-weight:600}button:hover{filter:brightness(.94)}nav{display:flex;gap:7px;border-bottom:1px solid #e8ebf0;padding-bottom:16px}.filter{background:#f0f2f7;color:#526277}.filter.active{background:#2856d9;color:white}ul{list-style:none;padding:0;margin:12px 0}li{display:flex;align-items:center;gap:12px;border-bottom:1px solid #edf0f4;padding:13px 0}li span{flex:1;overflow-wrap:anywhere}li input{width:19px;height:19px;accent-color:#2856d9}.done{text-decoration:line-through;color:#8692a1}.quiet{background:transparent;color:#526277;padding:7px}.danger{color:#b43a49}.empty{text-align:center;padding:35px}footer{font-size:.8rem;margin-top:24px}.sr{position:absolute;left:-9999px}@media(max-width:600px){.app{margin:0;min-height:100dvh;border:0;border-radius:0;padding:24px 18px}h1{font-size:2rem}form{gap:7px}form button{padding:10px}li{gap:7px}.quiet{padding:6px;font-size:.86rem}}
</style></head><body><main class="app"><header><div><p class="eyebrow">YOUR DAY, SIMPLIFIED</p><h1>TaskFlow</h1><p class="muted">A little clarity for what comes next.</p></div><span id="count" aria-live="polite"></span></header>
<form id="add-form"><label for="new-task" class="sr">New task</label><input id="new-task" placeholder="What needs to get done?" maxlength="200" required autocomplete="off"><button type="submit">Add task</button></form>
<nav aria-label="Task filters"><button type="button" class="filter active" data-filter="all" aria-pressed="true">All</button><button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button><button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button></nav>
<ul id="tasks" aria-live="polite"></ul><p id="empty" class="muted empty" hidden>No tasks here yet.</p><footer>Saved on this device · No account needed</footer></main>
<script>
"use strict";
const KEY="taskflow.tasks.v1",list=document.querySelector("#tasks"),input=document.querySelector("#new-task"),count=document.querySelector("#count"),empty=document.querySelector("#empty");
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(v)?v.filter(t=>t&&typeof t.id==="string"&&typeof t.title==="string"&&t.title.trim()&&t.title.length<=200&&typeof t.done==="boolean"):[]}catch{return []}}
let tasks=load(),filter="all",notice="";
function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));tasks=next;notice=""}catch{notice="Storage unavailable; changes were not saved."}render()}
function render(){list.replaceChildren();const visible=tasks.filter(t=>filter==="all"||t.done===(filter==="completed"));empty.hidden=visible.length!==0;count.textContent=tasks.filter(t=>!t.done).length+" remaining";
for(const task of visible){const li=document.createElement("li"),checkbox=document.createElement("input");checkbox.type="checkbox";checkbox.checked=task.done;checkbox.setAttribute("aria-label","Complete "+task.title);checkbox.addEventListener("change",()=>persist(tasks.map(t=>t.id===task.id?{...t,done:!t.done}:t)));
const title=document.createElement("span");title.textContent=task.title;if(task.done)title.className="done";
const edit=document.createElement("button");edit.textContent="Edit";edit.className="quiet";edit.addEventListener("click",()=>{const answer=prompt("Edit task",task.title);if(answer===null)return;const value=answer.trim();if(!value||value.length>200){alert("Enter 1–200 characters.");return}persist(tasks.map(t=>t.id===task.id?{...t,title:value}:t))});
const del=document.createElement("button");del.textContent="Delete";del.className="quiet danger";del.setAttribute("aria-label","Delete "+task.title);del.addEventListener("click",()=>persist(tasks.filter(t=>t.id!==task.id)));
li.append(checkbox,title,edit,del);list.append(li)}
let warning=document.querySelector("#storage-warning");if(!warning){warning=document.createElement("p");warning.id="storage-warning";warning.setAttribute("role","alert");list.after(warning)}warning.textContent=notice}
document.querySelector("#add-form").addEventListener("submit",e=>{e.preventDefault();const value=input.value.trim();if(!value||value.length>200)return;const next=[...tasks,{id:crypto.randomUUID(),title:value,done:false}];persist(next);if(!notice)input.value=""});
document.querySelectorAll("[data-filter]").forEach(button=>button.addEventListener("click",()=>{filter=button.dataset.filter;document.querySelectorAll("[data-filter]").forEach(b=>{const selected=b===button;b.classList.toggle("active",selected);b.setAttribute("aria-pressed",String(selected))});render()}));render();
</script></body></html>
